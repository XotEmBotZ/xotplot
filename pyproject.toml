[project]
name = "xotplot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "XotEmBotZ", email = "xotembotzop@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cartopy>=0.26.0",
    "matplotlib>=3.11.2",
