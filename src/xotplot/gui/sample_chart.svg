<svg class="w-full h-full" preserveAspectRatio="xMidYMid meet" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Scientific Spectral Gradient (Turbo colormap simulation) -->
<linearGradient id="turboGrad" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#30123b" stop-opacity="0.85"></stop>
<stop offset="18%" stop-color="#4145ab" stop-opacity="0.85"></stop>
<stop offset="35%" stop-color="#468dfc" stop-opacity="0.85"></stop>
<stop offset="48%" stop-color="#28d7b3" stop-opacity="0.85"></stop>
<stop offset="62%" stop-color="#a4fc3c" stop-opacity="0.85"></stop>
<stop offset="78%" stop-color="#fbbe22" stop-opacity="0.85"></stop>
<stop offset="90%" stop-color="#e9430c" stop-opacity="0.85"></stop>
<stop offset="100%" stop-color="#7a0403" stop-opacity="0.85"></stop>
</linearGradient>
<!-- Radial trough core pattern -->
<radialGradient cx="45%" cy="38%" id="troughCore" r="40%">
<stop offset="0%" stop-color="#1e104a" stop-opacity="0.95"></stop>
<stop offset="50%" stop-color="#144272" stop-opacity="0.85"></stop>
<stop offset="100%" stop-color="#0a2647" stop-opacity="0.1"></stop>
</radialGradient>
<radialGradient cx="72%" cy="65%" id="ridgeCore" r="45%">
<stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"></stop>
<stop offset="55%" stop-color="#10b981" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#064e3b" stop-opacity="0.0"></stop>
</radialGradient>
</defs>
<!-- Ocean Basin Base -->
<rect fill="#080e1a" height="520" width="960"></rect>
<!-- Shaded Synthetic Contours (500hPa Isohypses & Trough Field) -->
<!-- Base synoptic field layers -->
<path d="M -20,540 Q 250,480 420,380 T 780,240 Q 980,180 1000,120 L 1000,540 Z" fill="url(#ridgeCore)"></path>
<path d="M -20,240 Q 180,190 340,320 T 560,420 Q 720,410 1000,310 L 1000,-20 L -20,-20 Z" fill="url(#troughCore)"></path>
<!-- Smoothed Height Isohypses -->
<path d="M 0,420 C 180,390 320,460 480,480 C 640,490 820,430 960,390" fill="none" stroke="#22d3ee" stroke-dasharray="2 2" stroke-opacity="0.3" stroke-width="1.2"></path>
<path d="M 0,360 C 160,330 300,420 460,430 C 620,440 800,370 960,330" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"></path>
<path d="M 0,300 C 140,260 280,360 440,380 C 600,400 780,310 960,270" fill="none" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.8"></path>
<!-- Mid-level Cutoff Low Closed Contours -->
<ellipse cx="440" cy="340" fill="none" rx="90" ry="60" stroke="#818cf8" stroke-opacity="0.85" stroke-width="2.2" transform="rotate(-12 440 340)"></ellipse>
<ellipse cx="440" cy="340" fill="none" rx="55" ry="38" stroke="#a78bfa" stroke-opacity="0.95" stroke-width="2.5" transform="rotate(-12 440 340)"></ellipse>
<ellipse cx="440" cy="340" fill="none" rx="25" ry="18" stroke="#c084fc" stroke-opacity="1" stroke-width="2" transform="rotate(-12 440 340)"></ellipse>
<!-- Contour height labels along lines -->
<rect fill="#0f172a" fill-opacity="0.85" height="14" rx="2" width="46" x="235" y="322"></rect>
<text fill="#38bdf8" font-family="JetBrains Mono" font-size="9" font-weight="600" x="238" y="332">552 dam</text>
<rect fill="#0f172a" fill-opacity="0.85" height="14" rx="2" width="38" x="420" y="333"></rect>
<text fill="#c084fc" font-family="JetBrains Mono" font-size="9" font-weight="bold" x="424" y="343">540 L</text>
<rect fill="#0f172a" fill-opacity="0.85" height="14" rx="2" width="46" x="680" y="278"></rect>
<text fill="#4edea3" font-family="JetBrains Mono" font-size="9" font-weight="600" x="683" y="288">570 dam</text>
<rect fill="#0f172a" fill-opacity="0.85" height="14" rx="2" width="46" x="790" y="222"></rect>
<text fill="#fbbe22" font-family="JetBrains Mono" font-size="9" font-weight="600" x="793" y="232">582 dam</text>
<rect fill="#0f172a" fill-opacity="0.85" height="14" rx="2" width="38" x="830" y="160"></rect>
<text fill="#f87171" font-family="JetBrains Mono" font-size="9" font-weight="bold" x="834" y="170">594 H</text>
<!-- Geographic Coastlines & US State Lines (Cartopy Feature Layer) -->
<!-- Simplified North American Coastline outline for crisp scientific map representation -->
<path d="M 60,70 L 110,65 L 140,85 L 180,95 L 220,70 L 260,80 L 285,110 L 320,135 L 350,130 L 380,105 L 430,90 L 490,100 L 530,70 L 580,85 L 610,60 L 670,95 L 720,80 L 760,110 L 780,140 L 760,170 L 710,180 L 680,210 L 650,225 L 660,250 L 640,285 L 670,300 L 690,340 L 675,370 L 630,365 L 600,410 L 560,430 L 520,440 L 480,410 L 440,430 L 390,440 L 360,410 L 330,420 L 300,390 L 240,360 L 210,320 L 180,280 L 160,230 L 120,180 L 80,140 Z" fill="none" opacity="0.85" stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"></path>
<!-- US State internal borders (Natural Earth 1:50m style) -->
<path d="M 210,320 L 260,320 L 260,280 L 210,280 M 260,320 L 320,320 L 320,270 L 260,270 M 320,320 L 390,320 L 390,265 L 320,265 M 390,320 L 450,330 L 450,280 L 390,280 M 450,330 L 510,340 L 510,290 L 450,290 M 510,340 L 570,350 L 570,300 L 510,300 M 570,350 L 620,360 L 620,310 M 260,270 L 260,220 L 320,220 L 320,270 M 320,220 L 390,220 L 390,265 M 390,220 L 460,220 L 460,280" fill="none" opacity="0.6" stroke="#94a3b8" stroke-dasharray="1.5 2" stroke-width="0.7"></path>
<!-- Graticules (Latitude & Longitude Gridlines) -->
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="50" x2="910" y1="120" y2="120"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="50" x2="910" y1="240" y2="240"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="50" x2="910" y1="360" y2="360"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="50" x2="910" y1="460" y2="460"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="160" x2="160" y1="30" y2="490"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="340" x2="340" y1="30" y2="490"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="520" x2="520" y1="30" y2="490"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="700" x2="700" y1="30" y2="490"></line>
<line stroke="#334155" stroke-dasharray="3 3" stroke-width="0.75" x1="860" x2="860" y1="30" y2="490"></line>
<!-- Graticule Degree Labels (Cartopy GeoAxes Graticule Labels) -->
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="18" y="123">60°N</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="18" y="243">50°N</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="18" y="363">40°N</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="18" y="463">30°N</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="145" y="505">130°W</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="325" y="505">110°W</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="508" y="505">90°W</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="690" y="505">70°W</text>
<text fill="#64748b" font-family="JetBrains Mono" font-size="9" x="850" y="505">50°W</text>
<!-- 850 hPa Wind Barbs (Meteorological Vectors) -->
<!-- Sample wind barbs pointing cyclonically around trough -->
<g stroke="#38bdf8" stroke-linecap="round" stroke-width="1.2">
<!-- Barb 1 (SW 35 kts) -->
<g transform="translate(360, 410) rotate(-45)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<line x1="0" x2="8" y1="-22" y2="-18"></line>
<line x1="0" x2="8" y1="-18" y2="-14"></line>
<line x1="0" x2="8" y1="-14" y2="-10"></line>
<line x1="0" x2="4" y1="-10" y2="-8"></line>
</g>
<!-- Barb 2 (S 45 kts) -->
<g transform="translate(480, 420) rotate(-15)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<polygon fill="#38bdf8" points="0,-22 8,-20 0,-18"></polygon>
<line x1="0" x2="8" y1="-14" y2="-10"></line>
<line x1="0" x2="8" y1="-10" y2="-6"></line>
</g>
<!-- Barb 3 (SE 55 kts - Strong jet streak) -->
<g transform="translate(560, 370) rotate(35)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<polygon fill="#38bdf8" points="0,-22 9,-19 0,-16"></polygon>
<line x1="0" x2="8" y1="-12" y2="-8"></line>
</g>
<!-- Barb 4 (WNW 25 kts on backside) -->
<g transform="translate(340, 290) rotate(-130)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<line x1="0" x2="8" y1="-22" y2="-18"></line>
<line x1="0" x2="8" y1="-18" y2="-14"></line>
<line x1="0" x2="4" y1="-14" y2="-12"></line>
</g>
<!-- Barb 5 (NW 40 kts) -->
<g transform="translate(390, 260) rotate(-155)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<polygon fill="#38bdf8" points="0,-22 8,-20 0,-18"></polygon>
<line x1="0" x2="8" y1="-14" y2="-10"></line>
</g>
<!-- Barb 6 (Ridge anticyclonic flow 20 kts) -->
<g transform="translate(740, 240) rotate(60)">
<line x1="0" x2="0" y1="0" y2="-22"></line>
<line x1="0" x2="8" y1="-22" y2="-18"></line>
<line x1="0" x2="8" y1="-18" y2="-14"></line>
</g>
</g>
<!-- Coordinate Probe Target Point -->
<g transform="translate(440, 340)">
<circle class="animate-spin" cx="0" cy="0" fill="none" r="16" stroke="#f43f5e" stroke-dasharray="2 2" stroke-width="1"></circle>
<circle cx="0" cy="0" fill="#f43f5e" r="3"></circle>
<line stroke="#f43f5e" stroke-width="1.2" x1="-8" x2="8" y1="0" y2="0"></line>
<line stroke="#f43f5e" stroke-width="1.2" x1="0" x2="0" y1="-8" y2="8"></line>
</g>
</svg>